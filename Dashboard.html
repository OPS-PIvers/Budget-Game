<!-- Dashboard.html -->
<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <?!= include('Stylesheet'); ?>
  </head>
  <body>
    <header class="app-header">
      <div class="header-content">
        <a href="<?= getScriptUrl() ?>?view=activity" class="app-title">Budget Game Tracker</a>
        <div class="action-buttons">
          <?!= include('AccountSwitcher'); ?>
          <button id="email-button" class="btn btn-outline">Send Daily Digest</button>
          <a href="<?= getScriptUrl() ?>?view=admin" class="btn btn-outline">Admin</a>
        </div>
      </div>
    </header>

    <nav class="nav-container">
      <div class="main-nav">
        <a href="<?= getScriptUrl() ?>?view=expense" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
          </svg>
          Expenses
        </a>
        <a href="<?= getScriptUrl() ?>?view=activity" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24">
            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/>
            <path d="M18 9l-1.4-1.4-5.6 5.6-2.6-2.6L7 12l4 4z"/>
          </svg>
          Activities
        </a>
        <a href="<?= getScriptUrl() ?>?view=dashboard" class="nav-link active">
          <svg class="nav-icon" viewBox="0 0 24 24">
            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/>
            <path d="M9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/>
          </svg>
          Dashboard
        </a>
      </div>
    </nav>

    <div class="container main-content">
       <div id="household-info-placeholder"></div>

      <!-- Date Range Selector -->
      <div class="date-range-selector">
        <label for="date-range-select">Time Period:</label>
        <select id="date-range-select">
          <option value="30">Last 30 Days</option>
          <option value="90" selected>Last 90 Days</option>
          <option value="180">Last 6 Months</option>
          <option value="365">Last Year</option>
          <option value="0">All Time</option>
        </select>
        <span id="date-range-info" class="date-range-info"></span>
      </div>

      <div class="dashboard-section">
        <h3>Points Trend</h3>
        <div class="chart-container" id="points-chart-container">
          <div class="skeleton skeleton-chart"></div>
          <canvas id="points-chart" style="display:none;"></canvas>
        </div>
      </div>

      <div class="dashboard-section">
        <h3>Weekly Performance</h3>
        <div class="chart-container" id="weekly-chart-container">
          <div class="skeleton skeleton-chart"></div>
          <canvas id="weekly-chart" style="display:none;"></canvas>
        </div>
      </div>

      <div class="dashboard-section">
        <h3>Daily Distribution</h3>
        <div class="chart-container" id="daily-distribution-chart-container">
          <div class="skeleton skeleton-chart"></div>
          <canvas id="daily-distribution-chart" style="display:none;"></canvas>
        </div>
      </div>

      <div class="dashboard-section">
        <h3>Positive vs Negative</h3>
        <div class="chart-container" id="activity-ratio-chart-container">
          <div class="skeleton skeleton-chart"></div>
          <canvas id="activity-ratio-chart" style="display:none;"></canvas>
        </div>
      </div>

      <div class="dashboard-section">
        <h3>Activity Streaks</h3>
        <div class="streaks-container" id="streaks-container">
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card"></div>
        </div>
      </div>
      
      <!-- Goal Tracking Section -->
      <div class="dashboard-section">
        <h3>Goal Tracking</h3>
        <div id="goal-tracking-container">
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card"></div>
        </div>
      </div>
      
      <div class="dashboard-section">
        <h3>Weekly Goals</h3>
        <div id="weekly-goals-container">
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card"></div>
        </div>
      </div>

      <div class="dashboard-section">
        <h3>Goal Achievement History</h3>
        <div id="goal-history-container">
          <div class="skeleton skeleton-chart"></div>
        </div>
      </div>

      <div class="dashboard-section">
        <h3>Lifetime Activity Frequency</h3>
        <div class="chart-container" id="lifetime-chart-container">
          <div class="skeleton skeleton-chart"></div>
          <canvas id="lifetime-activity-chart" style="display:none;"></canvas>
        </div>
      </div>

      <div class="dashboard-section">
        <h3>Previous Week Activity Frequency</h3>
        <div class="chart-container" id="prev-week-chart-container">
          <div class="skeleton skeleton-chart"></div>
          <canvas id="prev-week-activity-chart" style="display:none;"></canvas>
        </div>
      </div>

        <div class="mobile-actions">
          <button id="mobile-email-button" class="btn btn-primary">Send Daily Digest</button>
          <a href="<?= getScriptUrl() ?>?view=admin" class="btn btn-outline">Admin</a>
        </div>
      </div>
    </div>

    <div id="notification" class="notification hidden"></div>

    <!-- Toast Notifications -->
    <?!= include('ToastNotifications'); ?>

    <!-- Error Handling -->
    <?!= include('ErrorHandler'); ?>

    <!-- Goal Update Modal -->
    <div id="goal-update-modal" class="goal-update-modal">
      <div class="goal-update-modal-content">
        <h3 class="goal-update-modal-title">Update Goal Amount</h3>
        <form id="goal-update-form" class="goal-update-form">
          <div style="margin-bottom:15px;">
            <label for="goal-update-amount">Current Amount:</label>
            <input type="number" id="goal-update-amount" step="0.01" min="0" required>
          </div>
          <div class="goal-update-modal-actions" style="display:flex;justify-content:flex-end;gap:10px;">
            <button type="button" class="btn btn-secondary" onclick="closeGoalUpdateModal()">Cancel</button>
            <button type="submit" class="btn btn-primary">Update</button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@2.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

<script>
      let charts = {};
      let dashboardDataCache = null;
      let configData = null;
      let currentDateRange = 90;

      // BRAND COLORS
      const COLOR_POSITIVE = '#739D5C';
      const COLOR_POSITIVE_BG = 'rgba(115, 157, 92, 0.2)';
      const COLOR_NEGATIVE = '#8C3B3B';
      const COLOR_NEGATIVE_BG = 'rgba(140, 59, 59, 0.2)';
      const COLOR_PRIMARY = '#546066';
      const COLOR_ACCENT = '#D7BD46';

      document.addEventListener('DOMContentLoaded', initializeDashboard);

      function initializeDashboard() {
        const refreshGoals = localStorage.getItem('refreshGoals') === 'true';
        if (refreshGoals) { localStorage.removeItem('refreshGoals'); }

        const emailBtn = document.getElementById('email-button');
        if (emailBtn) emailBtn.addEventListener('click', sendDailyDigest);
        const mobileEmailBtn = document.getElementById('mobile-email-button');
        if (mobileEmailBtn) mobileEmailBtn.addEventListener('click', sendDailyDigest);
        const goalUpdateForm = document.getElementById('goal-update-form');
        if (goalUpdateForm) goalUpdateForm.addEventListener('submit', handleGoalUpdate);
        const dateRangeSelect = document.getElementById('date-range-select');
        if (dateRangeSelect) dateRangeSelect.addEventListener('change', handleDateRangeChange);

        loadDashboardData();

        setInterval(() => {
          if (localStorage.getItem('refreshGoals') === 'true') {
            localStorage.removeItem('refreshGoals');
            loadWeeklyGoals();
          }
        }, 60000);
      }

      function loadDashboardData() {
        const cacheKey = `dashboard_${currentDateRange}`;
        if (dashboardDataCache && dashboardDataCache.key === cacheKey && (Date.now() - dashboardDataCache.timestamp < 300000)) {
            renderDashboard(dashboardDataCache.data);
            updateDateRangeInfo(dashboardDataCache.data.dateRange);
            loadSecondaryData();
            return;
        }
        google.script.run
          .withSuccessHandler(response => {
              if (!response || !response.success) { handleDashboardError({ message: response?.message || "Failed." }); return; }
              dashboardDataCache = { key: cacheKey, data: response, timestamp: Date.now() };
              renderDashboard(response);
              updateDateRangeInfo(response.dateRange);
              loadSecondaryData();
          })
          .withFailureHandler(handleDashboardError)
          .getHistoricalData(currentDateRange);
      }

      function handleDateRangeChange() {
        const selector = document.getElementById('date-range-select');
        currentDateRange = parseInt(selector.value);
        dashboardDataCache = null;
        loadDashboardData();
      }

      function updateDateRangeInfo(dateRange) {
        const infoSpan = document.getElementById('date-range-info');
        if (!infoSpan || !dateRange) return;
        const rowsText = dateRange.rowsLoaded !== undefined ? `(${dateRange.rowsLoaded} rows loaded)` : '';
        const dateText = dateRange.startDate && dateRange.endDate ? `${dateRange.startDate} to ${dateRange.endDate}` : '';
        infoSpan.textContent = [dateText, rowsText].filter(Boolean).join(' ');
      }

      function loadSecondaryData() {
           loadWeeklyGoals();
           loadGoalHistory();
           loadGoalTracking();
      }

      function renderDashboard(data) {
          try {
              if (data.householdId && data.householdName) {
                const ph = document.getElementById('household-info-placeholder');
                if(ph) { ph.innerHTML = `<div class="info-message">🏠 ${data.householdName}</div>`; ph.style.display='block'; }
              }

              hideSkeleton('points-chart-container');
              document.getElementById('points-chart').style.display = 'block';
              renderPointsChart(data.dailyData, data.movingAverages);

              hideSkeleton('weekly-chart-container');
              document.getElementById('weekly-chart').style.display = 'block';
              renderWeeklyChart(data.weeklyData);

              hideSkeleton('daily-distribution-chart-container');
              document.getElementById('daily-distribution-chart').style.display = 'block';
              renderDailyDistributionChart(data.weeklyData);

              hideSkeleton('activity-ratio-chart-container');
              document.getElementById('activity-ratio-chart').style.display = 'block';
              renderActivityRatioChart(data.lifetimeActivityCounts);

              hideSkeleton('lifetime-chart-container');
              document.getElementById('lifetime-activity-chart').style.display = 'block';
              renderActivityFrequencyChart('lifetime-activity-chart', data.lifetimeActivityCounts, 'Lifetime', true);

              hideSkeleton('prev-week-chart-container');
              document.getElementById('prev-week-activity-chart').style.display = 'block';
              renderActivityFrequencyChart('prev-week-activity-chart', data.prevWeekActivityCounts, 'Previous Week', false);

              renderStreaks(data.streakData, data.currentStreakSettings);

          } catch (error) {
              console.error(error);
              showNotification('Error rendering dashboard: ' + error.message, true);
          }
      }

      function renderPointsChart(dailyData, movingAverages) {
            const ctx = document.getElementById('points-chart').getContext('2d');
            if (!dailyData || !dailyData.length) return;
            dailyData.sort((a, b) => a.date.localeCompare(b.date));
            movingAverages.sort((a, b) => a.date.localeCompare(b.date));

            const labels = dailyData.map(day => day.date);
            const points = dailyData.map(day => day.points);
            const alignedAverages = labels.map(labelDate => {
                const avgData = movingAverages.find(avg => avg.date === labelDate);
                return avgData ? avgData.average : null;
            });

            if (charts.pointsChart) charts.pointsChart.destroy();
            charts.pointsChart = new Chart(ctx, {
                type: 'line',
                data: {
                  labels: labels,
                  datasets: [
                    { label: 'Daily Points', data: points, borderColor: COLOR_POSITIVE, backgroundColor: COLOR_POSITIVE_BG, fill: true, tension: 0.1 },
                    { label: '7-Day Avg', data: alignedAverages, borderColor: COLOR_ACCENT, borderWidth: 2, borderDash: [5, 5], pointRadius: 0, fill: false, spanGaps: true }
                 ]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { x: { type: 'time', time: { unit: 'day' } } } }
            });
      }

      function renderWeeklyChart(weeklyData) {
            const ctx = document.getElementById('weekly-chart').getContext('2d');
            if (!weeklyData || !weeklyData.length) return;
            weeklyData.sort((a, b) => a.startDate.localeCompare(b.startDate));
            const weeks = weeklyData.map(week => week.startDate);
            const points = weeklyData.map(week => week.totalPoints);
            if (charts.weeklyChart) charts.weeklyChart.destroy();
            charts.weeklyChart = new Chart(ctx, {
                type: 'bar',
                data: { labels: weeks, datasets: [{ label: 'Weekly Points', data: points, backgroundColor: points.map(p => p >= 0 ? COLOR_POSITIVE : COLOR_NEGATIVE) }] },
                options: { responsive: true, maintainAspectRatio: false, scales: { x: { type: 'time', time: { unit: 'week' } } } }
            });
      }

      function renderDailyDistributionChart(weeklyData) {
          const ctx = document.getElementById('daily-distribution-chart').getContext('2d');
          const dayTotals = { sun: 0, mon: 0, tue: 0, wed: 0, thu: 0, fri: 0, sat: 0 };
          const dayCounts = { sun: 0, mon: 0, tue: 0, wed: 0, thu: 0, fri: 0, sat: 0 };
          const dayKeys = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
          const dayFullNames = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];

          weeklyData.forEach(week => {
              const breakdown = week.dailyBreakdown;
              if (breakdown) {
                  dayFullNames.forEach((fullName, index) => {
                      const points = breakdown[fullName] ?? 0;
                      if (points !== 0) { dayTotals[dayKeys[index]] += points; dayCounts[dayKeys[index]]++; }
                  });
              }
          });
          const averages = dayKeys.map(key => dayCounts[key] > 0 ? (dayTotals[key] / dayCounts[key]) : 0);
          if (charts.dailyDistributionChart) charts.dailyDistributionChart.destroy();
          charts.dailyDistributionChart = new Chart(ctx, {
              type: 'bar',
              data: { labels: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], datasets: [{ label: 'Average Points', data: averages, backgroundColor: averages.map(v => v >= 0 ? COLOR_POSITIVE : COLOR_NEGATIVE) }] },
              options: { responsive: true, maintainAspectRatio: false }
          });
      }

      function renderActivityRatioChart(lifetimeActivityCounts) {
        const ctx = document.getElementById('activity-ratio-chart').getContext('2d');
        let totalPositive = 0, totalNegative = 0;
        if (!lifetimeActivityCounts) return;
        for (const act in lifetimeActivityCounts) {
            if (act === '_hasData') continue;
            const data = lifetimeActivityCounts[act];
            if (data.positive) totalPositive += data.count; else totalNegative += data.count;
        }
        if (charts.activityRatioChart) charts.activityRatioChart.destroy();
        charts.activityRatioChart = new Chart(ctx, {
          type: 'pie',
          data: { labels: ['Positive', 'Negative'], datasets: [{ data: [totalPositive, totalNegative], backgroundColor: [COLOR_POSITIVE, COLOR_NEGATIVE] }] },
          options: { responsive: true, maintainAspectRatio: false }
        });
      }

      function renderActivityFrequencyChart(canvasId, activityCounts, timeframe, usePercentage) {
        const ctx = document.getElementById(canvasId).getContext('2d');
        if (!activityCounts) return;
        const items = [];
        let total = 0;
        for (const act in activityCounts) {
            if (act === '_hasData') continue;
            const d = activityCounts[act];
            items.push({ name: act, count: d.count, positive: d.positive });
            total += d.count;
        }
        items.sort((a,b) => b.count - a.count);
        const sliced = items.slice(0, 15);
        if (charts[canvasId+'Chart']) charts[canvasId+'Chart'].destroy();
        charts[canvasId+'Chart'] = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: sliced.map(i => i.name),
            datasets: [{ label: timeframe, data: sliced.map(i => usePercentage && total > 0 ? (i.count/total)*100 : i.count), backgroundColor: sliced.map(i => i.positive ? COLOR_POSITIVE : COLOR_NEGATIVE) }]
          },
          options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false }
        });
      }

      function loadWeeklyGoals() {
        google.script.run.withSuccessHandler(renderWeeklyGoals).getWeeklyGoalsData();
      }

      function renderWeeklyGoals(data) {
          const c = document.getElementById('weekly-goals-container'); c.innerHTML = '';
          if (!data || !data.higherThanPrevious) return;
          const list = document.createElement('div'); list.className = 'goals-list simple';
          [data.higherThanPrevious, data.doublePoints].forEach(g => {
             list.innerHTML += `<div class="goal-card simple ${g.achieved?'achieved':'pending'}">
               <div class="goal-header"><h4>${g.description}</h4><span class="goal-status ${g.achieved?'status-achieved':'status-pending'}">${g.achieved?'Achieved':'Pending'}</span></div>
               <div class="goal-details simple"><span>Cur: ${g.current}</span><span>Target: ${g.target}</span></div>
             </div>`;
          });
          c.appendChild(list);
      }

      function loadGoalHistory() {
         google.script.run.withSuccessHandler(renderGoalHistory).getGoalAchievementHistory();
      }

      function renderGoalHistory(data) {
         const c = document.getElementById('goal-history-container'); c.innerHTML = '';
         if(!data || !data.weeklyTotals || !data.weeklyTotals.length) { c.innerHTML='<div class="info-message">No history available.</div>'; return; }
         const canvas = document.createElement('canvas'); canvas.id='weekly-totals-chart';
         const cc = document.createElement('div'); cc.className='chart-container'; cc.appendChild(canvas);
         c.appendChild(cc);

         const labels = data.weeklyTotals.map(w => w.week);
         const totals = data.weeklyTotals.map(w => w.total);
         const prevs = data.weeklyTotals.map(w => w.previousTotal);

         if (charts.weeklyTotalsChart) charts.weeklyTotalsChart.destroy();
         charts.weeklyTotalsChart = new Chart(canvas.getContext('2d'), {
             type: 'bar',
             data: {
               labels: labels,
               datasets: [
                 { label: 'Total', data: totals, backgroundColor: COLOR_POSITIVE },
                 { label: 'Prev Week', data: prevs, type:'line', borderColor: COLOR_PRIMARY }
               ]
             },
             options: { responsive: true, maintainAspectRatio: false }
         });
      }

      function loadGoalTracking() {
        google.script.run.withSuccessHandler(renderGoalTracking).getDetailedGoalData();
      }

      function renderGoalTracking(data) {
        const c = document.getElementById('goal-tracking-container');
        if(!data || (!data.activeGoals.length && !data.completedGoals.length)) { c.innerHTML = '<div class="info-message">No financial goals found.</div>'; return; }
        
        let html = '<div class="goal-tracking-goals">';
        data.activeGoals.forEach(g => {
           const p = g.progress || 0;
           html += `<div class="goal-tracking-card ${g.progressType}">
             <div class="goal-tracking-header"><h4 class="goal-tracking-title">${g.goalName}</h4><span class="goal-tracking-type">${g.progressType.replace('_',' ')}</span></div>
             <div class="goal-tracking-progress"><div class="goal-tracking-progress-bar"><div class="goal-tracking-progress-fill ${g.progressType}" style="width:${p}%"></div></div></div>
             <div class="goal-tracking-details"><span>$${g.currentAmount} / $${g.targetAmount}</span><span>${p}%</span></div>
             <div class="goal-tracking-actions"><button class="btn btn-primary btn-sm" onclick="openGoalUpdateModal('${g.goalId}', '${g.goalName}', ${g.currentAmount})">Update</button></div>
           </div>`;
        });
        html += '</div>';
        c.innerHTML = html;
      }

      function renderStreaks(streakData, currentStreakSettings) {
         const c = document.getElementById('streaks-container'); c.innerHTML = '';
         const full = streakData?.streaks || {};
         if(!Object.keys(full).length) { c.innerHTML='<div class="info-message">No active streaks.</div>'; return; }
         for(const act in full) {
            const days = full[act];
            c.innerHTML += `<div class="streak-card"><span class="streak-days">${days}</span> ${act} 🔥</div>`;
         }
      }

      // Utils
      function hideSkeleton(id) { const el = document.getElementById(id); if(el) { const sk = el.querySelector('.skeleton'); if(sk) sk.style.display='none'; } }
      function handleDashboardError(e) { console.error(e); showNotification(e.message, true); }
      function showNotification(m, err=false) { const n = document.getElementById('notification'); n.textContent=m; n.classList.remove('hidden'); if(err) n.style.backgroundColor=COLOR_NEGATIVE; setTimeout(()=>n.classList.add('hidden'),3000); }
      function sendDailyDigest() { google.script.run.withSuccessHandler(()=>showNotification('Sent')).forceSendDailyDigest(); }
      function openGoalUpdateModal(id, name, val) { currentGoalId=id; document.querySelector('.goal-update-modal-title').textContent=`Update ${name}`; document.getElementById('goal-update-amount').value=val; document.getElementById('goal-update-modal').classList.add('show'); }
      function closeGoalUpdateModal() { document.getElementById('goal-update-modal').classList.remove('show'); currentGoalId=null; }
      function handleGoalUpdate(e) { e.preventDefault(); const val = parseFloat(document.getElementById('goal-update-amount').value); google.script.run.withSuccessHandler(()=>{closeGoalUpdateModal(); loadGoalTracking(); showNotification('Updated');}).updateGoalAmounts([{goalId:currentGoalId, newAmount:val}]); }
    </script>
  </body>
</html>
