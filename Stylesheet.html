<!-- Stylesheet.html - Budget Game Dark Theme Design System -->
<style>
/* ========================================
   DESIGN TOKENS - Budget Game Brand System
   ======================================== */
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@300;400;500;600;700;800&display=swap');

:root {
  /* FOUNDATION */
  --bg-base: #0D1814;
  --bg-surface: #15201C;
  --bg-elevated: #1F2D27;
  --bg-moss: #3E4F45;

  /* SLATE SYSTEM */
  --slate-midnight: #363E42;
  --slate-charcoal: #546066;
  --slate-stone: #78878D;
  --slate-linen: #BCBDA7;

  /* ACCENTS & SEMANTIC */
  --accent-kinetic: #739D5C;
  --accent-solar: #D7BD46;
  --accent-danger: #8C3B3B; /* Updated to --error from brand board */
  --accent-info: #78878D;   /* Updated to --info from brand board */

  /* Semantic Aliases */
  --positive-color: var(--accent-kinetic);
  --negative-color: var(--accent-danger);
  --warning-color: var(--accent-solar);
  --info-color: var(--accent-info);
  --primary-color: var(--accent-kinetic);

  /* UI GRADIENTS (Angled for Buttons/Containers) */
  --grad-deep: linear-gradient(135deg, #0D1814 0%, #3E4F45 100%);
  --grad-slate: linear-gradient(90deg, #363E42 0%, #546066 100%);
  --grad-lume: linear-gradient(135deg, #3E4F45 0%, #739D5C 100%);
  --grad-solar: linear-gradient(135deg, #C1A15B 0%, #D7BD46 100%);

  /* DATA VIZ GRADIENTS */
  --viz-grad-moss: linear-gradient(to top, #1F2D27 0%, #3E4F45 100%);
  --viz-grad-slate: linear-gradient(to top, #363E42 0%, #546066 100%);
  --viz-grad-kinetic: linear-gradient(to top, #3E4F45 0%, #739D5C 100%);
  --viz-grad-linen: linear-gradient(to top, #78878D 0%, #BCBDA7 100%);

  /* Chart Colors (for JS reference via computed styles if needed) */
  --viz-1: #3E4F45;
  --viz-2: #546066;
  --viz-3: #739D5C;
  --viz-4: #BCBDA7;

  /* TYPOGRAPHY */
  --text-primary: #EAEFEC;  /* --text-main */
  --text-secondary: #BCBDA7; /* --text-muted */
  --text-muted: #78878D;     /* --slate-stone for even more muted */
  --text-inverse: #0D1814;
  --font-head: 'DM Serif Display', serif;
  --font-body: 'Manrope', sans-serif;

  /* UI CONFIG */
  --radius-sm: 4px;
  --radius-md: 6px; /* --radius from brand board */
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  --border-color: rgba(255, 255, 255, 0.1);
  --border-subtle: rgba(255, 255, 255, 0.05);

  /* SHADOWS */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.5);
  --shadow-lift: 0 4px 20px rgba(0, 0, 0, 0.5);
  --shadow-glow: 0 0 20px rgba(115, 157, 92, 0.3);

  /* TRANSITIONS */
  --transition-fast: 0.15s ease;
  --transition-base: 0.25s ease;
  --transition-slow: 0.4s ease;

  /* LAYOUT */
  --header-height: 64px;
  --container-max: 1100px;
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --space-2xl: 48px;
}

/* ========================================
   CSS RESET & BASE STYLES
   ======================================== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  scroll-behavior: smooth;
}

body {
  font-family: var(--font-body);
  background-color: var(--bg-base);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
  width: 100%;
  max-width: 100vw;
  overflow-x: hidden;
}

h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-head);
  font-weight: 400;
  line-height: 1.1;
  color: var(--text-primary);
  text-shadow: var(--shadow-lift);
}

h1 { font-size: 2.5rem; }
h2 { font-size: 2rem; }
h3 { font-size: 1.5rem; }
h4 { font-size: 1.25rem; }

p { margin-bottom: var(--space-md); color: var(--text-secondary); }

a {
  color: var(--accent-kinetic);
  text-decoration: none;
  transition: color var(--transition-fast);
}
a:hover { color: var(--slate-linen); }

/* ========================================
   LAYOUT COMPONENTS
   ======================================== */
.container {
  max-width: var(--container-max);
  margin: 0 auto;
  padding: 0 var(--space-md);
  width: 100%;
}

.main-content {
  padding: var(--space-lg) var(--space-md);
  margin-top: var(--space-lg);
}

/* HEADER */
.app-header {
  background: var(--grad-deep);
  border-bottom: 1px solid var(--border-color);
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  box-shadow: var(--shadow-sm);
}

.header-content {
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: var(--container-max);
  margin: 0 auto;
  padding: 0 var(--space-md);
  height: var(--header-height);
}

.app-title {
  font-family: var(--font-head);
  font-size: 1.5rem;
  color: var(--text-primary);
}

.action-buttons {
  display: flex;
  gap: var(--space-sm);
  align-items: center;
}

/* NAVIGATION */
.nav-container {
  background-color: var(--bg-surface);
  border-bottom: 1px solid var(--border-color);
  margin-top: var(--header-height);
}

.main-nav {
  display: flex;
  max-width: var(--container-max);
  margin: 0 auto;
  padding: 0 var(--space-md);
  gap: var(--space-xs);
}

.nav-link {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  padding: var(--space-md) var(--space-md);
  color: var(--text-secondary);
  font-weight: 600;
  font-size: 0.875rem;
  text-decoration: none;
  position: relative;
  transition: all var(--transition-fast);
  border-radius: var(--radius-md) var(--radius-md) 0 0;
}

.nav-link:hover {
  color: var(--text-primary);
  background-color: var(--bg-elevated);
}

.nav-link.active {
  color: var(--accent-kinetic);
  background-color: var(--bg-elevated);
}

.nav-link.active::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--grad-lume);
  border-radius: 3px 3px 0 0;
}

.nav-icon {
  width: 20px;
  height: 20px;
  fill: currentColor;
}

/* ========================================
   UI COMPONENTS (Brand Board Aligned)
   ======================================== */

/* BUTTONS */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 10px 20px;
  border-radius: var(--radius-md);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 0.875rem;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  text-decoration: none;
  border: 1px solid transparent;
  min-height: 40px;
}

.btn:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 6px 15px rgba(0,0,0,0.4);
}

.btn:active:not(:disabled) {
  transform: translateY(0);
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none !important;
  box-shadow: none !important;
}

/* Primary: Slate Gradient */
.btn-primary, .submit-btn {
  background: var(--grad-slate);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

/* Secondary: Outline/Ghost */
.btn-secondary, .btn-outline, .reset-btn {
  background: transparent;
  border: 1px solid var(--slate-charcoal);
  color: var(--text-primary);
}
.btn-secondary:hover:not(:disabled),
.btn-outline:hover:not(:disabled),
.reset-btn:hover:not(:disabled) {
  background: rgba(255,255,255,0.05);
  border-color: var(--text-primary);
}

/* Tertiary / Danger */
.btn-tertiary {
  background: rgba(255,255,255,0.05);
  color: var(--text-secondary);
}

.btn-danger {
  background: rgba(140, 59, 59, 0.2);
  color: #E58B8B;
  border: 1px solid var(--accent-danger);
}
.btn-danger:hover:not(:disabled) {
  background: var(--accent-danger);
  color: #fff;
}

.btn-sm {
  padding: 6px 12px;
  font-size: 0.75rem;
  min-height: 32px;
}

.btn-lg {
  padding: 12px 30px;
  font-size: 1rem;
  min-height: 48px;
}

/* FORMS */
input[type="text"],
input[type="number"],
input[type="email"],
input[type="date"],
select,
textarea {
  width: 100%;
  background: #0a100d; /* Dark input background */
  border: 1px solid rgba(255,255,255,0.1);
  padding: 10px;
  border-radius: var(--radius-md);
  font-family: var(--font-body);
  font-size: 0.875rem;
  color: var(--text-secondary);
  transition: border-color var(--transition-fast);
}

input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--accent-kinetic);
  color: var(--text-primary);
  box-shadow: 0 0 0 1px var(--accent-kinetic);
}

label {
  display: block;
  font-size: 0.75rem;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-bottom: 5px;
  letter-spacing: 1px;
}

/* CARDS & CONTAINERS */
.card, .section, .dashboard-section, .score-box, .expense-entry, .budget-summary-card, .recent-expenses {
  background: linear-gradient(135deg, var(--bg-surface) 0%, var(--bg-elevated) 100%);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: var(--space-lg);
  margin-bottom: var(--space-lg);
  box-shadow: var(--shadow-sm);
}

/* CALLOUTS */
.callout, .info-message, .error-message {
  padding: 10px;
  border-radius: var(--radius-md);
  font-size: 0.85rem;
  margin-bottom: var(--space-md);
  border-left: 3px solid;
  background: rgba(255,255,255,0.03);
}

.info-message { border-color: var(--slate-charcoal); color: var(--text-primary); }
.error-message { border-color: var(--accent-danger); color: #E58B8B; background: rgba(140, 59, 59, 0.1); }
.warning-message { border-color: var(--accent-solar); color: var(--accent-solar); background: rgba(215, 189, 70, 0.1); }

/* TAGS / BADGES */
.meta-tag, .status-badge, .goal-status {
  font-family: monospace;
  font-size: 0.7rem;
  padding: 2px 6px;
  border-radius: 4px;
  display: inline-block;
}

.tag-active, .status-ok, .status-achieved {
  background: rgba(115, 157, 92, 0.2);
  color: var(--accent-kinetic);
}
.tag-pending, .status-warning {
  background: rgba(215, 189, 70, 0.2);
  color: var(--accent-solar);
}
.tag-error, .status-over, .status-danger {
  background: rgba(140, 59, 59, 0.2);
  color: #E58B8B;
}

/* ========================================
   SPECIFIC VIEW STYLES
   ======================================== */

/* SCOREBOARD (Activity Tracker) */
.scoreboard {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: var(--space-lg);
  margin-bottom: var(--space-xl);
}

.score-box {
  text-align: center;
  position: relative;
  overflow: hidden;
}

.score-box::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--grad-lume);
  opacity: 0.5;
}

.score-box h2 {
  font-family: var(--font-body);
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--slate-linen);
  margin-bottom: var(--space-sm);
  text-shadow: none;
}

.score {
  font-family: var(--font-head);
  font-size: 3rem;
  line-height: 1;
  color: var(--text-primary);
  text-shadow: var(--shadow-lift);
}
.score.positive { color: var(--accent-kinetic); }
.score.negative { color: var(--accent-danger); }

/* ACTIVITY CHIPS */
.chip-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: var(--space-sm);
}

.activity-chip {
  display: flex;
  align-items: center;
  padding: 10px;
  background-color: var(--bg-elevated);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all var(--transition-fast);
  font-size: 0.875rem;
  user-select: none;
  min-height: 50px;
}

.activity-chip:hover {
  background-color: var(--bg-moss);
  border-color: var(--slate-charcoal);
  transform: translateY(-1px);
}

.activity-chip.positive { border-left: 3px solid var(--accent-kinetic); }
.activity-chip.negative { border-left: 3px solid var(--accent-danger); }
.activity-chip.required { border-left-color: var(--accent-solar); }

.activity-chip.selected {
  background: var(--grad-deep); /* Use deep gradient for selection */
  border-color: var(--accent-kinetic);
  box-shadow: var(--shadow-md);
}

.chip-text { flex-grow: 1; line-height: 1.3; }

.count-badge {
  background: var(--grad-lume);
  color: #fff;
  font-size: 0.7rem;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 10px;
  margin-left: 5px;
}

/* SECTION HEADERS (Activity Tracker) */
.section-header {
  padding: var(--space-md) var(--space-lg);
  font-family: var(--font-head);
  font-size: 1.25rem;
  color: var(--slate-linen);
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-subtle);
}
.section-content { padding: var(--space-md); }
.section-content.collapsed { display: none; }

/* EXPENSE TRACKER SPECIFIC */
.expense-header {
  background: var(--grad-lume); /* Replaces blue/green gradient */
  color: white;
  text-align: center;
  padding: 2rem 1rem;
  margin: -1rem -1rem 2rem -1rem; /* Pull to edges inside container */
  border-radius: var(--radius-lg); /* Rounded corners */
  margin-bottom: var(--space-lg);
}

.budget-amount.total { color: var(--slate-linen); }
.budget-amount.remaining { color: var(--accent-kinetic); }
.budget-amount.spent { color: #E58B8B; }

.store-chip, .category-chip {
  background: var(--bg-elevated);
  border: 1px solid var(--border-color);
  color: var(--text-secondary);
  border-radius: var(--radius-full);
}
.store-chip:hover, .category-chip:hover {
  border-color: var(--accent-kinetic);
  background: var(--bg-moss);
}
.store-chip.selected, .category-chip.selected {
  background: var(--grad-lume);
  color: #fff;
  border-color: transparent;
}

/* DASHBOARD & DATA VIZ */
.chart-container {
  position: relative;
  min-height: 250px;
  width: 100%;
}

.streak-card {
  border-left: 4px solid var(--slate-charcoal);
  background: linear-gradient(135deg, var(--bg-surface) 0%, var(--bg-elevated) 100%);
  padding: var(--space-md);
  border-radius: var(--radius-md);
  margin-bottom: var(--space-sm);
}
.streak-card.multiplier { border-left-color: var(--accent-kinetic); box-shadow: var(--shadow-glow); }
.streak-card.bonus1 { border-left-color: var(--accent-solar); }

.streak-days {
  font-family: var(--font-head);
  font-size: 2rem;
  color: var(--text-primary);
}

/* TABLE STYLES (Admin) */
table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
th {
  text-align: left;
  color: var(--slate-linen);
  font-size: 0.75rem;
  text-transform: uppercase;
  padding: 12px 8px;
  border-bottom: 2px solid var(--border-color);
}
td {
  padding: 12px 8px;
  border-bottom: 1px solid var(--border-subtle);
  color: var(--text-secondary);
}
tr:hover td {
  color: var(--text-primary);
  background: rgba(255,255,255,0.02);
}

/* TOAST NOTIFICATIONS */
.toast-container {
  position: fixed;
  top: 80px;
  right: var(--space-lg);
  z-index: 1001;
  display: flex;
  flex-direction: column;
  gap: var(--space-sm);
  pointer-events: none;
}
.toast {
  background: var(--bg-elevated);
  border: 1px solid var(--border-color);
  border-left: 4px solid var(--accent-kinetic);
  color: var(--text-primary);
  padding: var(--space-md);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  pointer-events: auto;
  opacity: 0;
  transform: translateX(20px);
  transition: all 0.3s ease;
}
.toast.show { opacity: 1; transform: translateX(0); }
.toast.error { border-left-color: var(--accent-danger); }

/* ACCOUNT SWITCHER */
.account-avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--grad-lume);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700;
  cursor: pointer;
  border: 2px solid var(--bg-surface);
}
.account-menu {
  background: var(--bg-elevated);
  border: 1px solid var(--border-color);
  box-shadow: var(--shadow-lg);
}
.account-menu-item:hover { background: var(--bg-moss); }

/* LOADING / SKELETON */
.skeleton {
  background: linear-gradient(90deg, var(--bg-elevated) 25%, var(--bg-moss) 50%, var(--bg-elevated) 75%);
  background-size: 200% 100%;
  animation: skeleton-loading 1.5s ease-in-out infinite;
  border-radius: var(--radius-md);
}
@keyframes skeleton-loading {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
.loading-overlay {
  background: rgba(13, 24, 20, 0.85);
  backdrop-filter: blur(4px);
}
.spinner {
  border: 3px solid rgba(255,255,255,0.1);
  border-top-color: var(--accent-kinetic);
}

/* UTILITIES */
.hidden { display: none !important; }
.text-right { text-align: right; }
.text-center { text-align: center; }

/* RESPONSIVE */
@media (max-width: 768px) {
  .scoreboard { grid-template-columns: 1fr; }
  .dashboard-row { grid-template-columns: 1fr; }
  .header-content { padding: 0 var(--space-sm); }
  .app-title { font-size: 1.25rem; }
  .action-buttons { display: none; } /* Hide desktop actions */
  .mobile-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
  .main-nav { justify-content: space-around; padding: 0; }
  .nav-link { padding: 10px 5px; flex-direction: column; font-size: 0.7rem; gap: 4px; }
  .chip-container { grid-template-columns: 1fr; }
  .activity-chip { padding: 12px; }

  /* Stack tables on mobile if needed or allow scroll */
  .scrollable-table { overflow-x: auto; }
}

/* ========================================
   ADMIN SPECIFIC STYLES
   ======================================== */
.household-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: var(--space-md);
  margin-bottom: var(--space-md);
}

.household-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--space-md);
  border-bottom: 1px solid var(--border-subtle);
  padding-bottom: var(--space-sm);
}

.household-member {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px;
  background: rgba(255,255,255,0.02);
  border-radius: var(--radius-sm);
  margin-bottom: 4px;
}

.category-order-item {
  display: flex;
  align-items: center;
  padding: 10px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-color);
  margin-bottom: 5px;
  border-radius: var(--radius-sm);
  cursor: grab;
}
.category-order-item.dragging { opacity: 0.5; }
.category-order-item.drag-over { border: 2px dashed var(--accent-kinetic); }

.drag-handle {
  width: 20px; height: 20px;
  background: repeating-linear-gradient(180deg, #888 0, #888 2px, transparent 2px, transparent 4px);
  margin-right: 10px;
  opacity: 0.5;
  cursor: grab;
}

/* ========================================
   DASHBOARD GOAL TRACKING STYLES
   ======================================== */
.goal-tracking-container {
  display: flex;
  flex-direction: column;
  gap: var(--space-lg);
}

.goal-tracking-summary {
  display: grid;
  gap: var(--space-md);
  padding-bottom: var(--space-md);
  border-bottom: 1px solid var(--border-subtle);
}

.summary-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
  gap: var(--space-md);
}

.stat {
  background: var(--bg-elevated);
  padding: var(--space-md);
  border-radius: var(--radius-md);
  text-align: center;
  border: 1px solid var(--border-color);
}

.stat-value {
  font-family: var(--font-head);
  font-size: 1.5rem;
  color: var(--accent-kinetic);
}

.stat-label {
  font-size: 0.75rem;
  color: var(--text-secondary);
  text-transform: uppercase;
}

.goal-tracking-goals {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: var(--space-md);
}

.goal-tracking-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: var(--space-md);
  display: flex;
  flex-direction: column;
